<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulaire</title>
</head>
<body>
    <Fieldset>
        <legend>Formulaire</legend>
        <form>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" placeholder="votre nom">
            <br>
            <label for="prénom">prénom :</label>
            <input type="text" id="prénom" name="prénom" placeholder="votre prénom">
            <br>
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" placeholder="votre email">
            <br>
            <label for="sexe">Sexe :</label>
           
            <input type="radio" id="homme" name="sexe" value="homme">  
            <label for="homme">Homme</label>
            <input type="radio" id="femme" name="sexe" value="femme">
            <label for="femme">Femme</label>
            <br>
            <label for="date_de_naissance">Date de naissance :</label>
            <input type="date" id="date_de_naissance" name="date_de_naissance">
            <br>
            <label for="age">Age :</label>
            <input type="number" id="age" name="age" placeholder="votre saisir age">
            <br>
            <label for="pays de provenance">pays de provenance :</label>
            <select name="pays de provenance" id="pays de provenance">
                <option value="france">France</option>
                <option value="espagne">Espagne</option>
                <option value="italie">Italie</option>
                <option value="allemagne">Allemagne</option>
                <option value="portugal">Portugal</option>
               
                </select>
            
            <br>
            <label for="profession disponible">profession disponible :</label>
            <input type="text" id="profession disponible" name="profession disponible" list="profession -disponible"> 
            <datalist id="profession -disponible">
                <option value="informaticien">
                <option value="medecin">
                <option value="ingenieur">
                <option value="enseignant">
                <option value="comptable">
                    <option value="génie logiciel et système informatique">
            </datalist>
            </input>
                        
            
        </form>
    </Fieldset>
    
    
</body>
</html>
