<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>connexion wifi_formulaire d'accès </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Connexion wifi</h1>
    <div class="carte">
        <fieldset>
            <form action="#" method="#"> 
        <label for="nom">Nom :</label>
        <input type="text" id="Nom" name="Nom" placeholder=" veuillez entrer votre nom">
        <br><br>
         <label for="prenom">Prenom :</label>
        <input type="text" id="Prenom" name="Prenom" placeholder=" veuillez entrer votre prénom">
        <br><br>
         <label for="email">email :</label>
        <input type="email" id="email" name="email" placeholder=" veuillez entrer votre email">
        <br><br>
        <label for="ticket"> ticket wifi :</label>
        <select id="ticket" name="ticket">
            <option value="100FCFA">ticket de 100FCFA -3heures</option>
            <option value="200FCFA">ticket de 200 FCFA -24heures</option>
            <option value="500FCFA">ticket de 500 FCFA -1semaine</option>
            <option value="2000FCFA">ticket de 2000 FCFA -1mois</option>
        </select>
        <br><br>
        <label for="heure_début">Heure de début de connexion :</label>
        <input type="time" id="heure_début" name="heure_début" placeholder=" veuillez entrer l'heure de début de connexion">
        <br><br>
        <p><small>la  connexion prend fin automatiquement à la durée indiquée par votre ticket,à partir de l'heure de début</small> </p>
        <br><br>
        <input type="submit" value="Se connecter">
       

    </form>
    </fieldset>
</div>
    
    
</body>
</html>
